# 右侧交易引擎 — Phase1（高精度模式）
# 原则：宁可错过，不可做错（涉及真金白银）
# 规格: docs/superpowers/specs/2026-09-18-right-side-trading-distillation-design.md

right_side:
  mode: precision              # precision=交易级高确信度；research=仅研究放宽
  symbol_universe: a
  precision_policy:
    miss_over_wrong: true      # 召回服从精确率
    empty_when_gate_fails: true
    require_capital_confirm: true
    require_quality_pass: true
    min_confluence: 3          # 至少 3 项独立确认
    max_outputs: 8             # 宁缺毋滥
    min_score: 72              # 综合分硬门槛（闸门通过后）

  liquidity:
    min_amount_20d: 200000000  # 20日均额 ≥ 2亿（抬高）
    min_bars: 160

  hard_filters:
    exclude_st: true
    exclude_limit_up_one_word: true
    exclude_negative_pe: true
    max_pe: 120                # 极端高估剔除（非价值判断，防题材泡沫）
    min_mv: 5000000000         # 总市值 ≥ 50亿

  gate:
    index_symbol: "IDX_000300"
    abs_mom_days: 126          # ~6M：比12M更贴近中期趋势，仍要求>0
    require_index_above_ma200: true
    # 闸门失败 → 无交易信号（precision）

  rs1:
    entry_n: 55
    exit_m: 20
    min_volume_ratio: 1.8      # 抬高：假突破第一杀手
    max_extension_ma20: 1.10   # 更严防追高
    require_above_ma60: true
    require_close_confirm: true  # 收盘突破，不只盘中
    weight: 1.0

  rs2:
    ma_stack: [5, 10, 20, 60, 120]
    pullback_ma: 10
    protect_ma: 20
    min_volume_ratio_on_reclaim: 1.0
    require_shrink_on_pullback: true  # 回踩日相对前一日缩量
    max_pullback_depth_pct: 0.08     # 回踩幅度不过深
    weight: 1.0

  score_weights:
    tech: 0.45
    capital: 0.30
    quality: 0.25

  capital:
    main_net_lookback: 5
    min_main_net_sum: 0        # 近5日主力净流入合计必须 ≥0
    prefer_main_net_sum: 30000000  # ≥3000万加分

  output:
    top_n: 8
    mutually_exclusive_with_rebound_oversold: true

  acceptance:  # 上线前硬门槛（事件回测未过不许当交易信号）
    min_oos_trades: 40
    min_win_rate: 0.52
    min_profit_factor: 1.3
    max_drawdown: 0.20
    require_dual_window: true
