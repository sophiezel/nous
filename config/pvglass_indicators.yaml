# ═══════════════════════════════════════════════════════════════════════
# 拐点信号 — 用指标自动判定"是否真的在修复"
# op: gte | lte | gt | lt | pct_chg_gte | pct_chg_lte | mom_streak_gte | mom_streak_lte
# window_days: 取值窗口；mom_streak_* 为末尾连续环比同向的期数阈值
# ═══════════════════════════════════════════════════════════════════════
signals:
  - id: S1_glass_price
    name: 玻璃价格趋势确认
    thesis: 结算价(非报价)站稳才能确认收入端修复
    logic: all
    conditions:
      - {indicator: glass_price_2_0_single, op: gte, value: 10.5, window_days: 30}
      - {indicator: glass_inventory_days, op: lte, value: 40, window_days: 45}
  - id: S2_polysilicon
    name: 硅料"有价无市"→规模成交
    thesis: 反内卷从口号变成成交，是行业最强的领先信号
    logic: all
    conditions:
      - {indicator: polysilicon_inventory, op: lte, value: 45, window_days: 60}
      - {indicator: polysilicon_price, op: pct_chg_gte, value: 5, window_days: 60}
  - id: S3_demand
    name: 需求端连续回暖
    thesis: 没有需求配合的涨价是政策脉冲
    logic: any
    conditions:
      - {indicator: module_schedule_cn, op: mom_streak_gte, value: 3, window_days: 200}
      - {indicator: pv_install_cn_monthly, op: pct_chg_gte, value: 10, window_days: 90}
  - id: S4_supply_exit
    name: 供给侧真实退出
    thesis: 冷修/关停公告落地 > 减产倡议书
    logic: all
    conditions:
      - {indicator: glass_capacity_cold_repair_ytd, op: gte, value: 19600, window_days: 365}
      - {indicator: glass_capacity_operating, op: lte, value: 72000, window_days: 60}
  - id: S5_xinyi_margin
    name: 信义玻璃分部毛利率修复
    thesis: 龙头报表确认盈利修复(单季毛利率≥8%)；需与福莱特交叉验证是否为行业性修复
    logic: all
    conditions:
      - {indicator: xinyi_glass_gm, op: gte, value: 8.0, window_days: 200}
  - id: S5f_flat_margin
    name: 福莱特玻璃毛利率修复
    thesis: 双雄同时转正才是行业性修复，而不是单家公司靠海外产能的结构性优势
    logic: all
    conditions:
      - {indicator: flat_glass_glass_gm, op: gte, value: 8.0, window_days: 200}
  - id: S6_valuation
    name: 估值与预期背离
    thesis: 一致预期上修 + PB 上行 = 预期交易启动
    logic: any
    conditions:
      - {indicator: consensus_np_fy2027, op: pct_chg_gte, value: 10, window_days: 90}
      - {indicator: xinyi_pb, op: gte, value: 0.8, window_days: 60}
