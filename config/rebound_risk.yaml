# 短期反弹引擎 — 风控配置（规格: 2026-08-24-rebound-risk-gate-design.md #9）
# 校准结论（2026-08-25 超跌族定向验证）：仅超跌族有效；反包族无样本外边际，已关闭。
# 配置 = A2 验证胜出项（校准段 Sharpe +0.46 / 样本外 +0.51，双窗口稳健）。

rebound:
  risk:
    hard_filter:
      min_daily_amount_5d: 50000000   # F4 流动性：近5日日均成交额 >= 5000万
      min_listing_days: 60            # F5 上市天数（用 stock_daily_all 最早 trade_date 近似）
      allow_20pct_board: true         # F6 20%涨跌幅标的（创业板/科创/北交所）默认参与

    quality:                          # 质量门槛（校准迭代新增）
      families: ["oversold"]          # 仅超跌族（反包族校准后关闭）
      min_score: 75                   # 得分门槛（降换手，对抗费用）
      entry_chase_cap: 0.05           # 限价单：次日开盘 > 信号日收盘×1.05 不成交（拒追高）
      oversold_trigger:               # 超跌族触发（放宽版，样本+稳健性优于原3跌/RSI30）
        min_consecutive_drops: 2
        max_rsi: 35

    stop_loss:
      atr_multiplier: 2.0             # 超跌族 ATR 兜底倍数
      day_low_min_buffer: 0.01        # 买入日最低价距买入价 <1% 时放宽到 ATR 兜底
      strong_family_pct: 0.08         # （反包族已关闭，保留参数）

    take_profit:
      oversold_first: 0.05            # 超跌族首目标 +5%
      strong_first: 0.08
      trail_drawdown: 0.04            # 移动止盈：收盘创新高后回撤 4%
      partial: 0.5                    # 到首目标出 1/2

    time_stop:
      oversold_days: 6                # 超跌族持有 6 日（校准：5→6 改善显著）
      strong_days: 4
      min_gain: 0.02                  # 累计收益 < +2% 即走

    position:
      max_single_pct: 0.15            # 单票 <= 15%
      max_sector_pct: 0.30            # 单板块 <= 30%
      max_daily_picks: 2              # 单日建仓 <= 2 只（校准：3→2 提升质量）

    gate:
      regime_position_limit:          # 第一层：regime 总仓位上限（复用 market_regime 规则）
        BULL: 0.90
        SIDEWAYS: 0.60
        VOLATILE: 0.30
        BEAR: 0.20
      sentiment_thresholds:           # 第二层：情绪 gate（sentiment_cache.score）
        hot: 75
        warm: 60
        cool: 40
      block_oversold_regimes: ["BEAR", "VOLATILE"]   # 接飞刀禁区
      block_strong_sentiment: ["cold", "cool"]
      exit_limit_down_count: 250      # 第三层：单日跌停家数（校准：200→250）
