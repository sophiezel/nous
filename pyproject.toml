[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nous"
version = "0.1.0"
description = "独立量化投研系统 — 双引擎荐股 × 鳄鱼派信号 × 全链路自动化"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "sophiezel"}
]
keywords = ["quant", "stock", "trading", "china-a-shares", "hong-kong", "alpha"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "akshare>=1.14,<2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "polars>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "requests>=2.31",
    "structlog>=24.0",
    "openai>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "curl-cffi>=0.6",
]

[project.scripts]
nous = "nous.cli:app"

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "slowapi>=0.1",
    "jinja2>=3.1",
]
scheduler = [
    "apscheduler>=3.10",
]
ml = [
    "lightgbm>=4.0",
    "catboost>=1.2",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "shap>=0.44",
    "optuna>=3.0",
    "joblib>=1.3",
    "mlflow>=2.10",
    "pyarrow>=14.0",
    "scipy>=1.11",
]
backtest = [
    "backtrader>=1.9",
    "pyarrow>=14.0",
    # pandas-ta 依赖 numba，暂不支持 Python 3.14；需要时单独: pip install pandas-ta
]
trading = [
    "PyPortfolioOpt>=1.5",
]
scraping = [
    "playwright>=1.40",
    "cryptography>=41.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nous*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = ["-v", "--tb=short", "--strict-markers", "--no-header"]
markers = [
    "slow: slow running tests",
    "integration: integration tests requiring DB",
    "llm: tests requiring LLM API calls",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
